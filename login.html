<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Two Hearts Cafe - Login</title><link rel="stylesheet" href="styles.css"></head><body class="login-body"><div class="login-card"><div class="login-brand">♡ Two Hearts Cafe</div><h1>POS Login</h1><p>Sign in to manage billing and orders.</p><form id="loginForm"><label>Username<input id="username" value="admin" autocomplete="username" required></label><label>Password<input id="password" type="password" value="admin123" autocomplete="current-password" required></label><button>Sign in</button><div id="loginError" class="error"></div></form><small>Default password: admin123 — change it before handover.</small></div><script>const f=document.getElementById('loginForm');f.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const j=await r.json();if(r.ok) location.href='/';else document.getElementById('loginError').textContent=j.error||'Login failed';});</script></body></html>
